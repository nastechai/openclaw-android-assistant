name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "21"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci --ignore-scripts || npm install

      - name: Build Vue frontend
        run: npm run build:frontend

      - name: Build CLI server
        run: npm run build:cli

      - name: Bundle server into APK assets
        run: bash android/scripts/build-server-bundle.sh

      - name: Download Termux bootstrap
        run: bash android/scripts/download-bootstrap.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── Signing ────────────────────────────────────────────────────────────
      # If ANDROID_KEYSTORE_BASE64 is set as a repo secret, decode it and pass
      # the path + passwords to Gradle so the release APK is fully signed.
      # On first-time builds (no secret yet), fall back to the SDK debug key.
      - name: Decode keystore (if secret present)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/anyclaw-release.jks"
            echo "path=${{ github.workspace }}/anyclaw-release.jks" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret — using debug keystore fallback"
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          GRADLE_ARGS="assembleRelease"
          if [ "${{ steps.keystore.outputs.available }}" = "true" ]; then
            GRADLE_ARGS="$GRADLE_ARGS \
              -PANDROID_KEYSTORE_PATH=${{ steps.keystore.outputs.path }} \
              -PANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS} \
              -PANDROID_STORE_PASSWORD=${ANDROID_STORE_PASSWORD} \
              -PANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          fi
          ./gradlew $GRADLE_ARGS

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/anyclaw.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anyclaw
          path: android/app/build/outputs/apk/release/anyclaw.apk

      - name: Generate changelog
        if: github.ref_type == 'branch'
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --reverse)
          else
            CHANGES=$(git log --pretty=format:"- %s" --reverse -20)
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$CHANGES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PAT || github.token }}
          tag_name: v${{ github.run_number }}
          name: "AnyClaw v${{ github.run_number }} (${{ github.ref_name }})"
          body: |
            🦞 **AnyClaw** — OpenClaw + Codex + Nastech Agent on Android

            📱 Install the APK on any ARM64 Android 7.0+ device. No root required.

            ### Changes
            ${{ steps.changelog.outputs.notes }}

            ---
            Branch: ${{ github.ref_name }}
            Built from commit ${{ github.sha }}
          files: android/app/build/outputs/apk/release/anyclaw.apk
          draft: false
          prerelease: false
